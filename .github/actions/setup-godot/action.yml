name: Godot de la UI
description: >
  Compila godot-manager, lo pone en el PATH y con él instala la versión de
  Godot de ui/.godot-version (y export templates si se piden). Queda como
  versión default, así que `godot` la corre.
inputs:
  templates:
    description: Plataformas de export templates (linux,windows). Vacío = ninguna.
    default: ""
runs:
  using: composite
  steps:
    - name: Compilar godot-manager
      shell: bash
      run: |
        make build
        echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
        echo "GODOT_DIR=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"
        echo "GODOT_VERSION=$(tr -d '[:space:]' < ui/.godot-version)" >> "$GITHUB_ENV"

    - name: Cache de Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ inputs.templates }}

    - name: Instalar Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        godot-manager install "$GODOT_VERSION" --yes
        if [ -n "$TEMPLATES" ]; then
          godot-manager templates "$GODOT_VERSION" --platforms="$TEMPLATES" --yes
        fi

    - name: Usar esa versión
      shell: bash
      run: |
        godot-manager set "$GODOT_VERSION"
        godot --version
        godot --headless --path ui --import
