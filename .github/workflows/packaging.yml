name: Paquetes

# Al publicar una release estable, actualiza el PKGBUILD de Arch
# (packaging/arch) y el manifest de Scoop (bucket/) con sus checksums, y los
# sube a main. Lo llama release.yml; el evento release cubre las que se
# publican a mano desde GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release (vX.Y.Z)
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Solo estables
        id: stable
        env:
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          case "$TAG" in *-*) echo "skip=true" >> "$GITHUB_OUTPUT" ;; esac
          if [ "$PRERELEASE" = true ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.stable.outputs.skip != 'true'
        with:
          ref: main
      - uses: actions/setup-go@v7
        if: steps.stable.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Actualizar
        if: steps.stable.outputs.skip != 'true'
        run: go run tools/packaging.go "$TAG"
      - name: Subir a main
        if: steps.stable.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/arch bucket
          git diff --cached --quiet && exit 0
          git commit -m "Paquetes: ${TAG#v}"
          git push origin HEAD:main
