name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Con los tags, `make build` le pone al CLI una versión como
          # v2.2.0-3-gabc123; con un hash solo, la UI lo toma por un CLI viejo.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-godot
      - name: Tests de la interfaz
        # GM_BIN: los tests de integración corren contra este godot-manager.
        env:
          GM_BIN: ${{ github.workspace }}/bin/godot-manager
        run: godot --headless --path ui -s res://tests/run_tests.gd
